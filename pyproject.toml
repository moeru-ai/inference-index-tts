[project]
authors = [{name = "Neko Ayaka", email = "neko@ayaka.moe"}]
name = "inference-index-tts"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = ["fastapi>=0.141.1,<0.142", "uvicorn>=0.35,<0.36"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
inference_index_tts = { path = ".", editable = true }
indextts = { path = "./index-tts", editable = true }

[tool.pixi.pypi-options]
no-build-isolation = ["flash-attn"]

[tool.pixi.tasks]
serve = "inference-index-tts"
test = "python -B -m unittest discover -s tests -v"

[tool.pixi.feature.dev.tasks]
format = "ruff format src tests"
format-check = "ruff format --check src tests"
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
typecheck = "ty check"
check = { depends-on = ["format-check", "lint", "typecheck", "test"] }

[tool.pixi.dependencies]
python = "3.11.*"
pip = ">=26.2.1,<27"
ffmpeg = ">=7.1,<9"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.15.22,<0.16"
ty = ">=0.0.61,<0.1"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
runtime = { features = [], solve-group = "default" }

[tool.pixi.target.linux-64.pypi-dependencies]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1%2Bcu12torch2.8cxx11abiTRUE-cp311-cp311-linux_x86_64.whl" }

[project.scripts]
inference-index-tts = "inference_index_tts.cli:main"
